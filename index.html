<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bayazit Finanz-Schule</title>
<meta name="theme-color" content="#05080d">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700;800&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<script>(function(){var m='dark';try{m=localStorage.getItem('kompass-theme')||'dark'}catch(e){}var t=m==='auto'?(window.matchMedia&&matchMedia('(prefers-color-scheme: light)').matches?'light':'dark'):m;document.documentElement.setAttribute('data-theme',t);})();</script>
<style>
:root{
  --bg:#05080d; --panel:#0b1118; --card:#0f1620; --card2:#0a0f15; --line:#1b2532; --line2:#2a3647; --line3:#36465b; --text:#dfe6ef; --soft:#b9c4d2; --soft2:#c9d2de; --mute:#7f8b9c;
  --up:#1fcf8f; --down:#f0605d; --gold:#f5c542; --blue:#4c9aff; --purple:#b388ff; --orange:#ff9f43; --aqua:#22d3ee; --lime:#a3e635; --pink:#ff4f9a; --indigo:#8c9eff; --teal:#2dd4bf;
  --chart:#020407; --hdr:rgba(5,8,13,.92); --veil:rgba(5,8,13,.75); --on-gold:#1b1505; --on-up:#03140d;
  --mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
  --sans:'Inter',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
}
[data-theme="light"]{
  --bg:#f3f5f9; --panel:#eef2f7; --card:#ffffff; --card2:#f7f9fc; --line:#dde3ec; --line2:#c9d2de; --line3:#b7c2d1; --text:#131a26; --soft:#3d4757; --soft2:#2c3646; --mute:#5d6879;
  --up:#087f5b; --down:#c62f2c; --gold:#946200; --blue:#1a66c9; --purple:#7445cc; --orange:#b45000; --aqua:#0e7490; --lime:#4d7c0f; --pink:#be185d; --indigo:#3949ab; --teal:#0f766e;
  --chart:#ffffff; --hdr:rgba(243,245,249,.92); --veil:rgba(255,255,255,.85); --on-gold:#ffffff; --on-up:#ffffff;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer}
header{position:sticky;top:0;z-index:5;background:var(--hdr);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:12px 16px;display:flex;align-items:center;gap:12px}
.logo{width:34px;height:34px;flex:none}
.brand{font-family:var(--mono);font-weight:800;letter-spacing:.06em;font-size:15px;line-height:1.15}
.brand small{display:block;color:var(--mute);font-weight:500;font-size:11px;letter-spacing:.12em}
.theme{margin-left:auto;display:inline-flex;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px;flex:none}
.theme button{border:0;background:none;color:var(--mute);font-family:var(--mono);font-size:12px;font-weight:700;border-radius:999px;padding:6px 10px;min-height:32px}
.theme button[aria-pressed="true"]{background:var(--gold);color:var(--on-gold)}
.theme button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.prog{margin-left:12px;font-family:var(--mono);font-size:11px;color:var(--mute);text-align:right}
.bar{width:110px;height:5px;background:var(--line);border-radius:9px;margin-top:5px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--up),var(--gold));width:0;transition:width .4s}
main{display:grid;grid-template-columns:330px 1fr;max-width:1280px;margin:0 auto;min-height:calc(100vh - 60px)}
#nav{border-right:1px solid var(--line);padding:14px 12px 40px;height:calc(100vh - 60px);overflow:auto;position:sticky;top:60px}
#search{width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--text);font:inherit;font-size:15px;outline:none}
#search:focus{border-color:var(--gold)}
.cat{margin:18px 4px 8px;font-family:var(--mono);font-size:11px;letter-spacing:.16em;color:var(--mute);text-transform:uppercase;display:flex;align-items:center;gap:8px}
.cat::after{content:"";flex:1;height:1px;background:var(--line)}
.item{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:1px solid transparent;border-radius:10px;padding:9px 8px;margin:2px 0}
.item:hover{background:var(--card)}
.item.on{background:var(--card);border-color:var(--line2)}
.item .ic{width:36px;height:36px;flex:none;border-radius:8px;background:var(--panel);border:1px solid var(--line);display:grid;place-items:center}
.item b{display:block;font-size:14.5px;font-weight:600}
.item span{display:block;font-size:12px;color:var(--mute);margin-top:1px}
.item .ok{margin-left:auto;color:var(--up);font-size:14px;opacity:0}
.item.seen .ok{opacity:1}
#view{padding:18px 22px 60px;min-width:0}
.back{display:inline-block;background:var(--card);border:1px solid var(--line);border-radius:9px;padding:7px 12px;font-size:14px;margin-bottom:12px}
.kicker{font-family:var(--mono);font-size:11px;letter-spacing:.16em;color:var(--mute);text-transform:uppercase}
h1{font-family:var(--mono);font-weight:800;letter-spacing:.03em;font-size:clamp(24px,4.4vw,36px);margin:4px 0 4px;text-transform:uppercase}
.lead{color:var(--soft);margin:0 0 14px;font-size:15.5px;line-height:1.5;max-width:760px}
.player{background:var(--chart);border:1px solid var(--line);border-radius:16px;overflow:hidden;max-width:700px}
.cwrap{position:relative;cursor:pointer}
canvas{display:block;width:100%}
.overlay{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;opacity:0;transition:opacity .25s}
.overlay.show{opacity:1}
.overlay div{background:var(--veil);border:1px solid var(--line2);border-radius:999px;padding:12px 18px;font-family:var(--mono);font-weight:700;font-size:14px;letter-spacing:.06em}
.caption{padding:12px 16px 4px;min-height:74px;border-top:1px solid var(--line)}
.caption .no{font-family:var(--mono);font-size:11px;color:var(--gold);letter-spacing:.14em}
.caption p{margin:5px 0 0;font-size:15.5px;line-height:1.45;transition:opacity .25s}
.ctrl{display:flex;align-items:center;gap:8px;padding:8px 12px 12px}
.cb{background:var(--card);border:1px solid var(--line);border-radius:9px;min-width:40px;height:38px;padding:0 10px;font-family:var(--mono);font-size:14px;font-weight:700}
.cb:hover{border-color:var(--line3)}
#seek{flex:1;accent-color:var(--down);height:28px}
.chips{display:flex;flex-wrap:wrap;gap:6px;padding:0 12px 14px}
.chip{background:none;border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-family:var(--mono);font-size:11.5px;color:var(--mute)}
.chip.on{border-color:var(--gold);color:var(--gold)}
.chip.done{color:var(--text)}
.info{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px;margin-top:16px;max-width:900px}
.box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.box h3{margin:0 0 8px;font-family:var(--mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase}
.box p,.box li{font-size:14.5px;line-height:1.5;color:var(--soft2);margin:0}
.box ul{margin:0;padding-left:18px}.box li{margin:3px 0}
.box.g h3{color:var(--up)}.box.y h3{color:var(--gold)}.box.b h3{color:var(--blue)}.box.r h3{color:var(--down)}
.pn{display:flex;justify-content:space-between;gap:10px;margin-top:18px;max-width:900px}
.pn button{flex:1;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;text-align:left;font-size:14px}
.pn button:last-child{text-align:right}
.pn small{display:block;color:var(--mute);font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;margin-bottom:3px}
.pn button:disabled{opacity:.35;cursor:default}
.disc{color:var(--mute);font-size:12px;margin-top:22px;max-width:900px}
.home{max-width:900px}
.home .tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-top:16px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;text-align:left}
.tile:hover{border-color:var(--line3)}
.tile b{display:block;font-family:var(--mono);font-size:14px;letter-spacing:.05em;text-transform:uppercase;margin:10px 0 4px}
.tile span{color:var(--mute);font-size:13px}
.quizbtn{background:var(--card);border-color:var(--line2) !important;margin-top:12px}
.qcard{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;max-width:760px}
.qbar{height:5px;background:var(--line);border-radius:9px;overflow:hidden;margin-bottom:14px}.qbar i{display:block;height:100%;background:var(--gold)}
.qq{font-size:18px;font-weight:700;line-height:1.4;margin:0 0 12px}
.qcv{border-radius:12px;overflow:hidden;border:1px solid var(--line);margin-bottom:12px;background:var(--chart)}
.opts{display:grid;gap:8px}
.opt{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:13px 14px;text-align:left;font-size:15.5px}
.opt:hover:not(:disabled){border-color:var(--line3)}
.opt.ok{border-color:var(--up);background:rgba(31,207,143,.12)}
.opt.bad{border-color:var(--down);background:rgba(240,96,93,.12)}
.opt:disabled{cursor:default}
.fb{margin-top:12px;padding:12px 14px;border-radius:12px;background:var(--panel);border:1px solid var(--line);font-size:14.5px;line-height:1.5}
.fb b{font-family:var(--mono)}
.qnav{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.qnav button{flex:1;min-width:140px;border-radius:12px;padding:12px;font-weight:700;border:1px solid var(--line);background:var(--panel)}
.qnav .main{background:var(--gold);color:var(--on-gold);border-color:var(--gold)}
.score{font-family:var(--mono);font-size:54px;font-weight:800;margin:6px 0}
.calc{margin-top:12px;max-width:900px}
.calc .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin:8px 0 12px}
.calc label{font-size:12px;color:var(--mute);font-family:var(--mono);letter-spacing:.06em}
.calc input{width:100%;margin-top:4px;padding:10px;border-radius:9px;border:1px solid var(--line);background:var(--panel);color:var(--text);font:inherit;font-size:16px}
.calc .res{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.calc .res div{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px}
.calc .res span{display:block;font-size:11.5px;color:var(--mute);font-family:var(--mono)}
.calc .res b{font-family:var(--mono);font-size:18px}
.bigtiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:14px;margin-top:18px}
.big{position:relative;overflow:hidden;text-align:left;background:linear-gradient(160deg,var(--card),var(--card2));border:1px solid var(--line);border-radius:18px;padding:18px 18px 16px;min-height:168px;display:flex;flex-direction:column;transition:transform .15s,border-color .15s}
.big:hover{transform:translateY(-2px);border-color:var(--acc)}
.big::before{content:"";position:absolute;inset:0 0 auto 0;height:3px;background:var(--acc)}
.big::after{content:"";position:absolute;right:-40px;top:-40px;width:160px;height:160px;border-radius:50%;background:radial-gradient(circle,var(--glow),transparent 70%)}
.big .bi{position:absolute;right:14px;top:16px;opacity:.95}
.big h2{font-family:var(--mono);font-weight:800;font-size:clamp(17px,1.6vw + 6px,21px);letter-spacing:.03em;text-transform:uppercase;margin:0 70px 8px 0;line-height:1.2;color:var(--acc)}
.big p{margin:0 0 14px;color:var(--soft);font-size:14.5px;line-height:1.45;max-width:85%}
.big .ft{margin-top:auto;display:flex;align-items:center;gap:10px;font-family:var(--mono);font-size:11.5px;color:var(--mute)}
.big .pb{flex:1;height:5px;background:var(--line);border-radius:9px;overflow:hidden}.big .pb i{display:block;height:100%;background:var(--acc)}
.big .go{color:var(--acc);font-size:16px;font-weight:800}
.lcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px;margin-top:16px}
.lc{display:flex;align-items:center;gap:12px;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.lc:hover{border-color:var(--acc)}
.lc .ic{width:48px;height:48px;flex:none;border-radius:10px;background:var(--panel);border:1px solid var(--line);display:grid;place-items:center}
.lc small{display:block;font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;color:var(--mute)}
.lc b{display:block;font-size:16px;margin:2px 0}
.lc span{display:block;font-size:13px;color:var(--mute)}
.lc .ok{margin-left:auto;color:var(--up);font-size:18px}
.start{margin-top:16px;background:var(--up);color:var(--on-up);border:0;border-radius:12px;padding:13px 20px;font-weight:800;font-size:15px}
@media (max-width:860px){
  main{grid-template-columns:1fr}
  #nav{position:static;height:auto;border-right:0;padding:12px 14px 40px}
  #view{padding:14px 12px 50px}
  #nav{display:none}
  .bar{width:70px}
  .theme button .tl{display:none}
  .theme button{padding:6px 9px}
  .brand small{display:none}
}
.calc canvas{width:100%;display:block;border-radius:10px;border:1px solid var(--line);background:var(--chart);margin-top:10px}
.calc .note{font-size:12.5px;color:var(--mute);margin-top:8px;line-height:1.45}
.rsel{display:flex;flex-wrap:wrap;gap:6px;margin:14px 0 4px;max-width:900px}
.rsel button{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:7px 12px;font-size:13.5px}
.rsel button.on{border-color:var(--gold);color:var(--gold)}
.calc select{width:100%;margin-top:4px;padding:10px;border-radius:9px;border:1px solid var(--line);background:var(--panel);color:var(--text);font:inherit;font-size:16px}
.calc.o h3{color:var(--orange)}.calc.a h3{color:var(--aqua)}.calc.l h3{color:var(--lime)}.calc.k h3{color:var(--pink)}.calc.t h3{color:var(--teal)}.calc.p h3{color:var(--purple)}
.big .bi svg{display:block}
</style>
</head>
<body>
<header>
  <svg class="logo" viewBox="0 0 34 34"><rect width="34" height="34" rx="8" fill="#0f1620"/><rect x="6" y="21" width="5" height="7" rx="1" fill="#4c9aff"/><rect x="13" y="16" width="5" height="12" rx="1" fill="#1fcf8f"/><rect x="20" y="9" width="5" height="19" rx="1" fill="#f5c542"/><path d="M6 17 L13 12 L19 8 L28 4" stroke="#f5c542" stroke-width="1.8" fill="none" stroke-linecap="round"/><circle cx="28" cy="4.5" r="2" fill="#f5c542"/></svg>
  <div class="brand" style="cursor:pointer" onclick="location.hash=''">FINANZ-SCHULE<small>BAYAZIT · GELD VERSTEHEN</small></div>
  <div class="theme" role="group" aria-label="Darstellung"><button data-m="dark" title="Dunkel">☾<span class="tl"> Dunkel</span></button><button data-m="light" title="Hell">☀<span class="tl"> Hell</span></button><button data-m="auto" title="Automatisch">◐<span class="tl"> Auto</span></button></div>
  <div class="prog"><span id="progtxt">0 / 0</span><div class="bar"><i id="progbar"></i></div></div>
</header>
<main>
  <nav id="nav">
    <input id="search" placeholder="Lektion suchen … z. B. Zinseszins" autocomplete="off">
    <div id="list"></div>
  </nav>
  <section id="view"></section>
</main>
<script>
"use strict";
/* ============ Farben & Helfer ============ */
const THEMES={
 dark:{bg:'#020407',grid:'#111a24',axis:'#6f7b8c',up:'#1fcf8f',down:'#f0605d',text:'#e6ecf3',gold:'#f5c542',blue:'#4c9aff',purple:'#b388ff',orange:'#ff9f43',mute:'#7f8b9c',sep:'#1b2532',pillBg:'rgba(2,4,7,.9)',card:'#0f1620',soft:'#b9c4d2',line2:'#2a3647',aqua:'#22d3ee',lime:'#a3e635',pink:'#ff4f9a',indigo:'#8c9eff',teal:'#2dd4bf'},
 light:{bg:'#ffffff',grid:'#eef1f5',axis:'#5d6879',up:'#087f5b',down:'#c62f2c',text:'#131a26',gold:'#946200',blue:'#1a66c9',purple:'#7445cc',orange:'#b45000',mute:'#5d6879',sep:'#dde3ec',pillBg:'rgba(255,255,255,.95)',card:'#f1f4f8',soft:'#3d4757',line2:'#c9d2de',aqua:'#0e7490',lime:'#4d7c0f',pink:'#be185d',indigo:'#3949ab',teal:'#0f766e'}};
const C=Object.assign({},THEMES.dark);
function setCanvasTheme(t){Object.assign(C,THEMES[t]||THEMES.dark);}
const MONO="'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace",SANS="'Inter',system-ui,-apple-system,Segoe UI,Roboto,sans-serif";
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const ease=x=>x<.5?2*x*x:1-Math.pow(-2*x+2,2)/2;
const lerp=(a,b,f)=>a+(b-a)*f;
const de=(x,d=0)=>x.toLocaleString('de-DE',{minimumFractionDigits:d,maximumFractionDigits:d});
const eur=(x,d=0)=>de(x,d)+' €';
const pc=(x,d=1)=>de(x,d)+' %';
function hexA(hex,a){if(hex.startsWith('rgba'))return hex;const n=parseInt(hex.slice(1),16);return `rgba(${n>>16&255},${n>>8&255},${n&255},${a})`;}
const RM=r=>Math.pow(1+r,1/12)-1; /* Monatszins aus Jahreszins */
function sparVerlauf(rate,jahre,r,start=0){const rm=RM(r),out=[start];let v=start;for(let m=1;m<=jahre*12;m++){v=v*(1+rm)+rate;if(m%12===0)out.push(v);}return out;}

/* ============ Zeichen-Werkzeuge (virtuelle Fläche 460 × 290) ============ */
const VW=460,VH=290;
let X=null,QUIZ=false;
function font(size,w=700,sans=false){return `${w} ${size}px ${sans?SANS:MONO}`;}
function T(x,y,s,o={}){if((o.a??1)<=0)return;X.save();X.globalAlpha*=clamp(o.a??1);X.font=font(o.size||13,o.w||700,o.sans);X.fillStyle=o.col||C.text;X.textAlign=o.al||'center';X.textBaseline=o.bl||'middle';X.fillText(s,x,y);X.restore();}
function tw(s,size=13,w=700,sans=false){X.save();X.font=font(size,w,sans);const v=X.measureText(s).width;X.restore();return v;}
function rr(x,y,w,h,r){r=Math.min(r,Math.abs(w)/2,Math.abs(h)/2);X.beginPath();X.moveTo(x+r,y);X.arcTo(x+w,y,x+w,y+h,r);X.arcTo(x+w,y+h,x,y+h,r);X.arcTo(x,y+h,x,y,r);X.arcTo(x,y,x+w,y,r);X.closePath();}
function box(x,y,w,h,o={}){if((o.a??1)<=0||w<=0||h<=0)return;X.save();X.globalAlpha*=clamp(o.a??1);rr(x,y,w,h,o.r??5);if(o.fill){X.fillStyle=o.fill;X.fill();}if(o.stroke){X.strokeStyle=o.stroke;X.lineWidth=o.lw||1.5;if(o.dash)X.setLineDash(o.dash);X.stroke();}X.restore();}
/* Pille: erklärende Beschriftung – im Quiz ausgeblendet */
function pill(x,y,s,col,a=1,o={}){if(QUIZ&&!o.keep||a<=0)return;const size=o.size||12,w=tw(s,size)+16,h=size+11;let bx=o.al==='left'?x:o.al==='right'?x-w:x-w/2;bx=clamp(bx,4,VW-4-w);
 X.save();X.globalAlpha*=clamp(a);rr(bx,y-h/2,w,h,h/2);X.fillStyle=o.solid?col:C.pillBg;X.fill();X.strokeStyle=col;X.lineWidth=1.4;X.stroke();
 X.font=font(size);X.fillStyle=o.solid?C.bg:col;X.textAlign='center';X.textBaseline='middle';X.fillText(s,bx+w/2,y+.5);X.restore();}
function head(x1,y1,x2,y2,col,s=8){const a=Math.atan2(y2-y1,x2-x1);X.fillStyle=col;X.beginPath();X.moveTo(x2,y2);X.lineTo(x2-s*Math.cos(a-.45),y2-s*Math.sin(a-.45));X.lineTo(x2-s*Math.cos(a+.45),y2-s*Math.sin(a+.45));X.closePath();X.fill();}
function arrow(x1,y1,x2,y2,col,p=1,lw=2){if(p<=0)return;const x=lerp(x1,x2,p),y=lerp(y1,y2,p);X.save();X.strokeStyle=col;X.lineWidth=lw;X.lineCap='round';X.beginPath();X.moveTo(x1,y1);X.lineTo(x,y);X.stroke();if(p>.25)head(x1,y1,x,y,col);X.restore();}
/* Linie über Punkte, p = gezeichneter Anteil */
function path(pts,col,p=1,lw=2.5,dash){if(p<=0||pts.length<2)return;const n=(pts.length-1)*clamp(p),i=Math.floor(n),f=n-i;X.save();X.strokeStyle=col;X.lineWidth=lw;X.lineJoin='round';X.lineCap='round';if(dash)X.setLineDash(dash);X.beginPath();X.moveTo(pts[0][0],pts[0][1]);for(let k=1;k<=i;k++)X.lineTo(pts[k][0],pts[k][1]);if(i<pts.length-1)X.lineTo(lerp(pts[i][0],pts[i+1][0],f),lerp(pts[i][1],pts[i+1][1],f));X.stroke();X.restore();
 return i<pts.length-1?[lerp(pts[i][0],pts[i+1][0],f),lerp(pts[i][1],pts[i+1][1],f)]:pts[pts.length-1];}
function area(pts,y0,col,p=1,a=.18){if(p<=0)return;const n=Math.max(1,Math.round((pts.length-1)*clamp(p)));X.save();X.fillStyle=hexA(col,a);X.beginPath();X.moveTo(pts[0][0],y0);for(let k=0;k<=n;k++)X.lineTo(pts[k][0],pts[k][1]);X.lineTo(pts[n][0],y0);X.closePath();X.fill();X.restore();}
function dot(x,y,col,r=4,a=1){if(a<=0)return;X.save();X.globalAlpha*=clamp(a);X.fillStyle=col;X.beginPath();X.arc(x,y,r,0,7);X.fill();X.strokeStyle=C.bg;X.lineWidth=1.5;X.stroke();X.restore();}
function coin(x,y,r,col,a=1,lab){if(a<=0)return;X.save();X.globalAlpha*=clamp(a);X.fillStyle=col;X.beginPath();X.arc(x,y,r,0,7);X.fill();X.strokeStyle=hexA(col.startsWith('#')?col:'#f5c542',.5);X.lineWidth=1;X.beginPath();X.arc(x,y,r*.72,0,7);X.strokeStyle=C.bg;X.globalAlpha*=.35;X.stroke();X.restore();if(lab)T(x,y+.5,lab,{size:Math.max(8,r*.9),col:C.bg,a});}
/* Diagrammfläche: gibt Y(v) zurück und zeichnet Raster + Beschriftung */
function plot(o){const {x0=58,x1=448,y0=252,y1=46,max,min=0,ticks=4,lab=v=>de(v)}=o;const Y=v=>y0-(v-min)/(max-min)*(y0-y1);
 X.save();X.lineWidth=1;for(let i=0;i<=ticks;i++){const v=min+(max-min)*i/ticks,y=Y(v);X.strokeStyle=i===0?C.line2:C.grid;X.beginPath();X.moveTo(x0,y);X.lineTo(x1,y);X.stroke();T(x0-6,y,lab(v),{size:9.5,col:C.mute,al:'right',w:500});}X.restore();return Y;}
function xlabels(list){list.forEach(([x,s])=>T(x,265,s,{size:9.5,col:C.mute,w:500}));}

 {q:'Was bedeutet TER?',a:['Die laufenden jährlichen Kosten eines Fonds','Die Steuer auf Erträge','Die Rendite pro Jahr','Die Mindestanlage'],e:'Total Expense Ratio = Gesamtkostenquote pro Jahr.',l:'ter'},

 {q:'Ein Sparplan mit 100 € im Monat – wie viel zahlst du in 30 Jahren ein?',a:['36.000 €','3.600 €','30.000 €','12.000 €'],e:'100 € × 12 × 30 = 36.000 €.',l:'sparplan'},

 {q:'In stetig steigenden Märkten liegt meist vorne …',a:['… die Einmalanlage','… der Sparplan','… das Sparbuch','… Bargeld'],e:'Das Geld ist früher komplett investiert und profitiert länger vom Anstieg.',l:'einmal'},

 {q:'500 € im Monat bei 7 %: Etwa wann ist die erste Million erreicht?',a:['Nach rund 37 Jahren','Nach rund 10 Jahren','Nach rund 20 Jahren','Nach rund 80 Jahren'],e:'Das zeigt die Lektion „Dein Sparziel“ – nach etwa 37 Jahren.',l:'ziel'}
];
TQ.push(...EXTRA_TQ);
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
let Q=null;
function startQuiz(){
 current=null;P.L=null;P.cv=null;
 const pics=shuffle(LESSONS.filter(l=>l.qpic)).slice(0,4).map(L=>({pic:L,q:L.qpic.q,opts:shuffle([L.qpic.ans,...L.qpic.wrong]),ans:L.qpic.ans,e:L.box.was,l:L.id}));
 const txt=shuffle(TQ.slice()).slice(0,6).map(x=>({q:x.q,opts:shuffle(x.a.slice()),ans:x.a[0],e:x.e,l:x.l}));
 Q={list:shuffle([...pics,...txt]),i:0,score:0,wrong:[]};renderList();renderQ();
}
function renderQ(){
 const it=Q.list[Q.i],n=Q.list.length;
 view.innerHTML=`<button class="back" id="back">‹ Startseite</button>
 <div class="kicker">Quiz · Frage ${Q.i+1} von ${n} · ${Q.score} richtig</div><h1>Teste dein Wissen</h1>
 <div class="qcard"><div class="qbar"><i style="width:${Q.i/n*100}%"></i></div>
 <p class="qq">${it.q}</p>${it.pic?'<div class="qcv"><canvas id="qcv"></canvas></div>':''}
 <div class="opts">${it.opts.map((o,k)=>`<button class="opt" data-k="${k}">${String.fromCharCode(65+k)}) ${o}</button>`).join('')}</div>
 <div id="fb"></div></div>`;
 document.getElementById('back').onclick=()=>{location.hash='';};
 if(it.pic)drawStatic(document.getElementById('qcv'),it.pic);
 view.querySelectorAll('.opt').forEach(b=>b.onclick=()=>answer(+b.dataset.k));window.scrollTo(0,0);
}
function answer(k){
 const it=Q.list[Q.i],ok=it.opts[k]===it.ans;if(ok)Q.score++;else Q.wrong.push(it.l);
 view.querySelectorAll('.opt').forEach((b,j)=>{b.disabled=true;if(it.opts[j]===it.ans)b.classList.add('ok');else if(j===k)b.classList.add('bad');});
 const last=Q.i===Q.list.length-1,L=LESSONS.find(x=>x.id===it.l);
 document.getElementById('fb').innerHTML=`<div class="fb"><b style="color:${ok?'var(--up)':'var(--down)'}">${ok?'✓ RICHTIG!':'✗ LEIDER FALSCH'}</b>${ok?'':` – richtig ist: <b>${it.ans}</b>`}<br>${it.e}</div>
 <div class="qnav"><button id="tol">📖 Lektion: ${L?L.title:''}</button><button class="main" id="nx">${last?'Ergebnis ansehen':'Weiter ›'}</button></div>`;
 document.getElementById('tol').onclick=()=>location.hash=it.l;
 document.getElementById('nx').onclick=()=>{if(last)renderResult();else{Q.i++;renderQ();}};
}
function renderResult(){
 const n=Q.list.length,sc=Q.score;if(sc>best){best=sc;try{localStorage.setItem('fs-best',best)}catch(e){}}renderList();
 const msg=sc===n?'Perfekt! Du bist ein echter Finanz-Profi. 🏆':sc>=8?'Sehr stark! Fast alles richtig. 💪':sc>=5?'Gut! Ein paar Lektionen kannst du noch wiederholen.':'Nicht schlimm – schau dir die Lektionen unten nochmal an und versuch es erneut.';
 const rep=[...new Set(Q.wrong)].map(id=>LESSONS.find(l=>l.id===id)).filter(Boolean);
 view.innerHTML=`<button class="back" id="back">‹ Startseite</button><div class="kicker">Quiz · Ergebnis</div><h1>Geschafft!</h1>
 <div class="qcard"><div class="score" style="color:${sc>=8?'var(--up)':sc>=5?'var(--gold)':'var(--down)'}">${sc} / ${n}</div><p style="font-size:16px;margin:0 0 6px">${msg}</p>
 <p style="color:var(--mute);font-family:var(--mono);font-size:12px;margin:0">BESTWERT: ${best} / ${n}</p>
 ${rep.length?`<p style="margin:16px 0 6px;font-weight:700">Diese Lektionen solltest du wiederholen:</p><div class="opts">${rep.map(l=>`<button class="opt" data-id="${l.id}">📖 ${l.title}</button>`).join('')}</div>`:''}
 <div class="qnav"><button id="home">Zur Übersicht</button><button class="main" id="again">🎯 Neues Quiz</button></div></div>`;
 document.getElementById('back').onclick=()=>{location.hash='';};
 view.querySelectorAll('.opt[data-id]').forEach(b=>b.onclick=()=>location.hash=b.dataset.id);
 document.getElementById('home').onclick=()=>{location.hash='';};
 document.getElementById('again').onclick=()=>{startQuiz();};
}
function drawStatic(cv,L){const w=cv.parentElement.clientWidth,h=Math.round(w*VH/VW),dpr=window.devicePixelRatio||1;cv.width=Math.round(w*dpr);cv.height=Math.round(h*dpr);cv.style.height=h+'px';
 const tl=buildTL(L);renderScene(cv.getContext('2d'),L,tl,tl.total,w,true);}

/* ---- Schleife ---- */
function frame(ts){
 const dt=P.last?Math.min(60,ts-P.last):0;P.last=ts;
 if(P.L&&P.cv){
  if(P.playing){P.t+=dt*P.speed;if(P.t>=P.tl.total){P.t=P.tl.total;P.playing=false;updBtn();markSeen(P.L.id);}P.dirty=true;}
  if(P.dirty){
   renderScene(P.ctx,P.L,P.tl,P.t,P.W,false);
   const sk=document.getElementById('seek');if(sk)sk.value=P.t;
   let si=0;P.tl.steps.forEach((s,i)=>{if(P.t>=s.t)si=i;});
   if(si!==P.stepIdx){P.stepIdx=si;const cp=document.getElementById('captxt');cp.style.opacity=0;setTimeout(()=>{cp.textContent=P.tl.steps[si].text;cp.style.opacity=1;},120);
    document.getElementById('stepno').textContent=`SCHRITT ${si+1} / ${P.tl.steps.length}`;
    document.querySelectorAll('.chip').forEach((c,i)=>{c.classList.toggle('on',i===si);c.classList.toggle('done',i<si);});}
   P.dirty=false;
  }
 }
 requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{P.dirty=true;resize();});

/* ============ Hell/Dunkel ============ */
const mqLight=window.matchMedia?matchMedia('(prefers-color-scheme: light)'):null;
function themeMode(){try{return localStorage.getItem('kompass-theme')||'dark'}catch(e){return 'dark'}}
function applyTheme(m){const t=m==='auto'?(mqLight&&mqLight.matches?'light':'dark'):m;document.documentElement.setAttribute('data-theme',t);setCanvasTheme(t);
 document.querySelectorAll('.theme button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.m===m)));
 const mc=document.querySelector('meta[name=theme-color]');if(mc)mc.setAttribute('content',t==='light'?'#f3f5f9':'#05080d');
 P.dirty=true;document.querySelectorAll('.calc canvas').forEach(c=>drawCalcChart(c));const qc=document.getElementById('qcv');if(qc&&Q&&Q.list[Q.i]&&Q.list[Q.i].pic)drawStatic(qc,Q.list[Q.i].pic);}
document.querySelectorAll('.theme button').forEach(b=>b.addEventListener('click',()=>{try{localStorage.setItem('kompass-theme',b.dataset.m)}catch(e){}applyTheme(b.dataset.m);}));
if(mqLight&&mqLight.addEventListener)mqLight.addEventListener('change',()=>{if(themeMode()==='auto')applyTheme('auto');});
applyTheme(themeMode());

function route(){const id=decodeURIComponent(location.hash.slice(1));if(id==='quiz')startQuiz();else if(id==='rechner'||id.startsWith('rechner-'))showRechner(id.slice(8));else if(id.startsWith('kat-'))showCat(id.slice(4));else if(id)openLesson(id);else showHome();}
window.addEventListener('hashchange',route);
updProg();route();
try{if("serviceWorker" in navigator&&/kompassapps\.de$/.test(location.hostname))navigator.serviceWorker.register("sw.js");}catch(e){}
</script>
